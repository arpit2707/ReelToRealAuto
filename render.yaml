services:
  - type: web
    name: reel2real-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        value: https://reel2realbooking.in
      - key: FRONTEND_URL
        value: https://reel2realbooking.in
      - key: META_APP_ID
        value: "1390089122590430"
      # Set these in the Render dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: AI_SERVICE_URL
        sync: false
